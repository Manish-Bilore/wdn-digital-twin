<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 604" width="100%" role="img" aria-label="Pipeline architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ccd0"/></marker></defs><rect width="1180" height="604" fill="#fbfbfc"/><text x="78" y="44" font-size="20" font-weight="700" fill="#202124">From an estate-office drawing to a queryable twin</text><text x="78" y="68" font-size="13" fill="#5f6368">Nine stages. Every number below is produced by the pipeline, not typed in.</text><text x="22" y="164.0" font-size="11.5" font-weight="700" fill="#1a73e8" transform="rotate(-90 22 164.0)" text-anchor="middle" letter-spacing="1.2">PHYSICAL</text><rect x="78" y="96" width="320" height="128" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6"/><rect x="78" y="96" width="5" height="128" rx="2.5" fill="#1a73e8"/><text x="98" y="126" font-size="17" font-weight="700" fill="#202124">CAD</text><text x="98" y="146" font-size="12.5" fill="#1a73e8" font-weight="600">AC1015 drawing</text><text x="98" y="168" font-size="12" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">267 centrelines</text><text x="98" y="184" font-size="12" fill="#5f6368" font-family="ui-monospace,Menlo,monospace">66 annotations</text><text x="380" y="211" font-size="11" fill="#9aa0a6" text-anchor="end">GDAL / libopencad</text><path d="M404,160.0 L432,160.0" stroke="#c8ccd0" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="96" width="320" height="128" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.6"/><rect x="440" y="96" width="5" height="128" rx="2.5" fill="#1a73e8"/><text x="460" y="126" font-size="17" font-weight="700" fill="#202124">GIS</text><text x="460" y="146" font-size="12.5" fill="#1a73e8" font-weight="600">georeferenced</text><text x="460" y="168" font-size="12" 