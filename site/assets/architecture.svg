<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 612" width="100%" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Nine-stage pipeline from CAD drawing to digital twin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6dade"/></marker></defs><rect width="1062" height="612" fill="#ffffff"/><text x="8" y="34" font-size="17" font-weight="600" fill="#202124">From an estate-office drawing to a queryable twin</text><text x="8" y="57" font-size="12.5" fill="#5f6368">Every number here is written by the pipeline, not typed in.</text><text x="8" y="92" font-size="10" font-weight="700" fill="#1a73e8" letter-spacing="1.4">PHYSICAL</text><rect x="8" y="104" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="26" y="132" font-size="14.5" font-weight="600" fill="#202124">CAD</text><text x="26" y="151" font-size="11.5" fill="#1a73e8" font-weight="600">AC1015 drawing</text><text x="26" y="173" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">267 centrelines</text><text x="26" y="188" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">66 annotations</text><text x="312" y="208" font-size="10" fill="#9aa0a6" text-anchor="end">GDAL / libopencad</text><path d="M335,162.0 L362,162.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="370" y="104" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="388" y="132" font-size="14.5" font-weight="600" fill="#202124">GIS</text><text x="388" y="151" font-size="11.5" fill="#1a73e8" font-weight="600">georeferenced</text><text x="388" y="173" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EPSG:32643</text><text x="388" y="188" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">footprint IoU 0.685</text><text x="674" y="208" font-size="10" fill="#9aa0a6" text-anchor="end">auto-registration</text><path d="M697,162.0 L724,162.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="732" y="104" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="750" y="132" font-size="14.5" font-weight="600" fill="#202124">Network graph</text><text x="750" y="151" font-size="11.5" fill="#1a73e8" font-weight="600">noded topology</text><text x="750" y="173" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">322 pipes</text><text x="750" y="188" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">275 junctions</text><text x="1036" y="208" font-size="10" fill="#9aa0a6" text-anchor="end">shapely</text><text x="8" y="282" font-size="10" font-weight="700" fill="#e8710a" letter-spacing="1.4">MODEL</text><rect x="8" y="294" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="26" y="322" font-size="14.5" font-weight="600" fill="#202124">EPANET</text><text x="26" y="341" font-size="11.5" fill="#e8710a" font-weight="600">hydraulic state</text><text x="26" y="363" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pressure 15–68 m</text><text x="26" y="378" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">velocity 0–1.6 m/s</text><text x="312" y="398" font-size="10" fill="#9aa0a6" text-anchor="end">WNTR · EPANET 2.2</text><path d="M335,352.0 L362,352.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="370" y="294" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="388" y="322" font-size="14.5" font-weight="600" fill="#202124">Sensors</text><text x="388" y="341" font-size="11.5" fill="#e8710a" font-weight="600">monitoring design</text><text x="388" y="363" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5 districts</text><text x="388" y="378" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">29 locations</text><text x="674" y="398" font-size="10" fill="#9aa0a6" text-anchor="end">K-means + overlay</text><path d="M697,352.0 L724,352.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="732" y="294" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="750" y="322" font-size="14.5" font-weight="600" fill="#202124">Ontology</text><text x="750" y="341" font-size="11.5" fill="#e8710a" font-weight="600">OWL 2 DL</text><text x="750" y="363" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">network · sensing</text><text x="750" y="378" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">placement</text><text x="1036" y="398" font-size="10" fill="#9aa0a6" text-anchor="end">SOSA/SSN · QUDT</text><text x="8" y="472" font-size="10" font-weight="700" fill="#188038" letter-spacing="1.4">SEMANTIC</text><rect x="8" y="484" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="26" y="512" font-size="14.5" font-weight="600" fill="#202124">Knowledge graph</text><text x="26" y="531" font-size="11.5" fill="#188038" font-weight="600">instances</text><text x="26" y="553" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">8,554 triples</text><text x="26" y="568" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">833 entities</text><text x="312" y="588" font-size="10" fill="#9aa0a6" text-anchor="end">rdflib</text><path d="M335,542.0 L362,542.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="370" y="484" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="388" y="512" font-size="14.5" font-weight="600" fill="#202124">SPARQL</text><text x="388" y="531" font-size="11.5" fill="#188038" font-weight="600">live query</text><text x="388" y="553" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">in the browser</text><text x="388" y="568" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~26 kB gzipped</text><text x="674" y="588" font-size="10" fill="#9aa0a6" text-anchor="end">Oxigraph WASM</text><path d="M697,542.0 L724,542.0" stroke="#d6dade" stroke-width="1.4" marker-end="url(#a)"/><rect x="732" y="484" width="322" height="116" rx="8" fill="#ffffff" stroke="#e4e7ea" stroke-width="1"/><text x="750" y="512" font-size="14.5" font-weight="600" fill="#202124">Digital twin</text><text x="750" y="531" font-size="11.5" fill="#188038" font-weight="600">one model</text><text x="750" y="553" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ask across</text><text x="750" y="568" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">all five layers</text><text x="1036" y="588" font-size="10" fill="#9aa0a6" text-anchor="end">this site</text></svg>