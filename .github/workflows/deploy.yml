name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The pipeline needs a DEM that is too large to version, so the published
      # site is built from the committed outputs/ snapshot. Re-run the pipeline
      # locally when the inputs change and commit the new outputs.
      - name: Export web payload
        run: python pipeline/scripts/05_export_web.py -o outputs -s site -n iitb

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render
        run: quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
